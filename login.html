<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — WILDGUARD</title>

    <meta
        name="description"
        content="Secure WILDGUARD monitoring access"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header id="header" class="site-header">

    <div class="nav-wrap">

        <a href="index.html" class="brand">
            WILDGUARD
        </a>

        <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            aria-label="Open navigation"
        >
            Menu
        </button>

        <nav id="menu" class="nav-menu">

            <a href="index.html">Overview</a>

            <a href="monitor.html">Live Monitor</a>

            <a href="detections.html">Detections</a>

            <a href="map.html">Map</a>

            <a href="devices.html">Devices</a>

            <a href="analytics.html">Analytics</a>

            <a href="video-history.html">
                Video History
            </a>

            <a href="about.html">About</a>

        </nav>

    </div>

</header>


<main>

    <section class="hero login-section">

        <div class="hero-inner reveal">

            <p class="eyebrow">
                SECURE ACCESS
            </p>

            <h1>
                WILDGUARD
            </h1>

            <p class="hero-copy">
                Sign in to access wildlife detections,
                monitoring data, alerts and historical recordings.
            </p>


            <form id="loginForm" class="login-form">

                <div class="form-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign in
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <span>
            WILDGUARD
        </span>

        <span>
            Secure wildlife monitoring
        </span>

    </div>

</footer>


<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
